name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'agent/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Run checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm exec playwright install chromium

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend and tooling
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

      - name: Validate pull-request commits
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $baseRef = "${{ github.event.pull_request.base.ref }}"
          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $headSha = "${{ github.event.pull_request.head.sha }}"

          git fetch --no-tags origin "$baseRef"

          $hasBaseSha = $false
          $hasHeadSha = $false

          git cat-file -e "$baseSha^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0) { $hasBaseSha = $true }

          git cat-file -e "$headSha^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0) { $hasHeadSha = $true }

          if ($hasBaseSha -and $hasHeadSha) {
            npm exec commitlint -- --from "$baseSha" --to "$headSha" --verbose
          } else {
            $mergeBase = git merge-base "origin/$baseRef" HEAD
            npm exec commitlint -- --from "$mergeBase" --to HEAD --verbose
          }

      - name: Install Rust quality components
        run: rustup component add clippy

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test

      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check

      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit
