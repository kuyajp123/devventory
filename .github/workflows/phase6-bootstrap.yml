name: Phase 6 publish

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: phase6-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.head_ref == 'agent/phase-6-environment-tracker'
    runs-on: ubuntu-latest

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-6-environment-tracker
          fetch-depth: 0

      - name: Apply verified source payload
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .phase6-source/part-00
            cat .phase6-source/part-01
            cat .phase6-repair/part-*
            cat .phase6-source/part-03
            cat .phase6-source/part-04
          } | base64 --decode > /tmp/phase6.tar.xz
          echo '2a3004a1171e60d7c7ed7e90cddda53138e22f5a6c7e18c448994303aab226ff  /tmp/phase6.tar.xz' | sha256sum --check
          tar -xJf /tmp/phase6.tar.xz
          sed -i 's/async fn keeps_environment_names_and_order isolated_per_project()/async fn keeps_environment_names_and_order_isolated_per_project()/' src-tauri/src/features/environment_tracker/tests.rs
          python - <<'PY'
          from pathlib import Path

          source_modal = Path('src/features/environment-tracker/components/SourceFormModal.tsx')
          content = source_modal.read_text()
          content = content.replace(
              "import { useForm } from 'react-hook-form';",
              "import { useForm, useWatch } from 'react-hook-form';",
          )
          content = content.replace(
              "  const {\n    formState:",
              "  const {\n    control,\n    formState:",
          )
          content = content.replace("    setValue,\n    watch,\n", "    setValue,\n")
          content = content.replace(
              "  const selectedPath = watch('relativePath');",
              "  const selectedPath = useWatch({ control, name: 'relativePath' });",
          )
          source_modal.write_text(content)

          page = Path('src/features/environment-tracker/pages/EnvironmentTrackerPage.tsx')
          content = page.read_text()
          effect_start = "  useEffect(() => {\n    setSearch('');"
          effect_end = "    setBusySourceId(null);\n  }, [activeProjectId]);"
          if effect_start not in content or effect_end not in content:
              raise SystemExit('Expected active-project reset statements were not found.')
          content = content.replace(
              effect_start,
              "  useEffect(() => {\n    queueMicrotask(() => {\n      setSearch('');",
              1,
          )
          content = content.replace(
              effect_end,
              "      setBusySourceId(null);\n    });\n  }, [activeProjectId]);",
              1,
          )
          page.write_text(content)
          PY
          rm -rf .phase6-source .phase6-payload .phase6-repair
          rm .github/workflows/phase6-bootstrap.yml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci

      - name: Format frontend
        run: npm run format

      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt

      - name: Publish one implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset --soft origin/main
          git commit -m "feat: implement environment tracker"
          git push --force-with-lease origin HEAD:agent/phase-6-environment-tracker
