name: Phase 6 apply

on:
  push:
    branches:
      - agent/phase-6-environment-tracker

permissions:
  contents: write

concurrency:
  group: phase6-apply
  cancel-in-progress: true

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'activate phase 6 implementation')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: agent/phase-6-environment-tracker
          fetch-depth: 0

      - name: Apply source payload
        shell: bash
        run: |
          cat .phase6-source/part-* | base64 --decode > /tmp/phase6.tar.xz
          echo '2a3004a1171e60d7c7ed7e90cddda53138e22f5a6c7e18c448994303aab226ff  /tmp/phase6.tar.xz' | sha256sum --check
          tar -xJf /tmp/phase6.tar.xz
          rm -rf .phase6-source .phase6-payload
          rm .github/workflows/phase6-bootstrap.yml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci

      - name: Format frontend
        run: npm run format

      - name: Lint frontend
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check frontend and tooling
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

      - name: Install Rust formatting component
        run: rustup component add rustfmt

      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt

      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test

      - name: Publish one implementation commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset --soft origin/main
          git commit -m "feat: implement environment tracker"
          git push --force-with-lease origin HEAD:agent/phase-6-environment-tracker
